<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KEROKIEL DOC_GEN</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="buttons no-print">
      <button class="add-content">Add Certificate</button>
      <button class="print-page">Print</button>
    </div>

    <div id="certificates-container"></div>

    <!-- Modal Structure -->
    <div id="inputModal" class="modal no-print">
      <div class="modal-content">
        <h2>Create New Certificate</h2>
        <form id="certificateForm">
          <label for="organizationType">Agency/Office/Company:</label>
          <input type="text" id="organizationType" required />

          <label for="address">Address:</label>
          <input type="text" id="address" required />

          <label for="fullName">Full Name:</label>
          <input type="text" id="fullName" required />

          <label for="institutionName">Institution Name:</label>
          <input type="text" id="institutionName" required />

          <label for="date">Date of Appearance:</label>
          <input type="date" id="date" required />

          <label for="purpose">Purpose:</label>
          <input type="text" id="purpose" required />

          <div class="modal-buttons">
            <button type="submit">Add Certificate</button>
            <button type="button" class="cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
